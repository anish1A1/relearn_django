
{% extends 'index.html' %}
{% block title %}Register - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Create Employee Account</h3>
                <form method="post">
                    {% csrf_token %}
                    <!-- Manually rendering or using |crispy for professional styling -->
                    {{ form.as_p }} 
                    <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
                </form>
                <p class="mt-3 text-center">
                    Already have an account? <a href="{% url 'login' %}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
